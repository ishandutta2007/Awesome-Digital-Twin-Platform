<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Nodes/Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="396" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Background Grid Mesh -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" />
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" />
  </g>

  <!-- Dynamic Animated Twin Network Graphic (Right Side) -->
  <g transform="translate(850, 200)" opacity="0.85">
    <!-- Outer Pulsing Orbit Ring -->
    <circle r="120" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner Counter-Rotating Ring -->
    <circle r="80" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>

    <!-- Connecting Twin Mesh Lines -->
    <g stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.7">
      <line x1="-80" y1="-40" x2="0" y2="-90" />
      <line x1="0" y1="-90" x2="80" y2="-30" />
      <line x1="80" y1="-30" x2="60" y2="70" />
      <line x1="60" y1="70" x2="-50" y2="80" />
      <line x1="-50" y1="80" x2="-80" y2="-40" />
      <line x1="0" y1="0" x2="-80" y2="-40" />
      <line x1="0" y1="0" x2="80" y2="-30" />
      <line x1="0" y1="0" x2="60" y2="70" />
      <line x1="0" y1="0" x2="-50" y2="80" />
      <line x1="0" y1="0" x2="0" y2="-90" />
    </g>

    <!-- Central Digital Twin Core Node -->
    <circle r="14" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <!-- Satellite Twin Nodes -->
    <circle cx="-80" cy="-40" r="6" fill="#818cf8" filter="url(#glow)" />
    <circle cx="0" cy="-90" r="7" fill="#c084fc" filter="url(#glow)" />
    <circle cx="80" cy="-30" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="60" cy="70" r="6" fill="#818cf8" filter="url(#glow)" />
    <circle cx="-50" cy="80" r="5" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Ambient Light Glow in Background -->
  <circle cx="250" cy="180" r="180" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="900" cy="200" r="220" fill="#818cf8" opacity="0.08" filter="url(#softGlow)" />

  <!-- Foreground Foreground Content (Clear & High Contrast) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
        ENTERPRISE &amp; IOT TWINS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Awesome Digital Twin Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Curated List of SaaS Products &amp; Open-Source Twin Frameworks
    </text>

    <!-- Key Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="80" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
          ⚡ IIoT &amp; AAS
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(175, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="90" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
          🌐 SaaS &amp; Open-Source
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" stroke="#334155" />
        <text x="95" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
          📊 3D &amp; Multi-Physics
        </text>
      </g>
    </g>
  </g>
</svg>
